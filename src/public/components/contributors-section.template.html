<div class="py-28">
  <div class="site-container">
    <div class="max-w-7xl">
      <p
        class="mb-1 text-sm font-semibold tracking-widest text-base-content/70 uppercase"
      >
        Research investment network
      </p>
      <h1
        class="mb-5 text-3xl leading-none font-bold tracking-tight text-base-content"
      >
        Funding contributors
      </h1>
      <p class="max-w-prose text-xl">
        Public agencies, foundations, industry partners, and donors provide the
        resources that turn UC Davis research into work with lasting value for
        California and beyond.
      </p>
    </div>

    <div class="my-8 grid border-y border-main-border sm:grid-cols-3">
      <div class="py-5 sm:pr-6">
        <p
          id="source-total"
          class="total-span topic-color-text mb-1 text-2xl leading-none font-bold text-base-content"
        >
          $-.- million
        </p>
        <p
          class="mb-0 text-base font-semibold tracking-wider text-base-content/70 uppercase"
        >
          Research investment
        </p>
      </div>
      <div class="border-t border-main-border py-5 sm:col-span-2 sm:border-t-0">
        <ol
          id="source-top-contributors"
          class="grid gap-5 sm:grid-cols-3"
          aria-label="Top contributors"
          aria-live="polite"
        >
          <li>
            <p
              class="source-contributor-total mb-1 text-2xl leading-none font-bold"
            ></p>
            <p
              class="source-contributor-name mb-0 text-base font-semibold tracking-wider text-base-content/70 uppercase"
            >
              <span class="text-base-content/50" aria-hidden="true">1.</span>
              <span class="source-contributor-name-text"></span>
            </p>
          </li>
          <li>
            <p
              class="source-contributor-total mb-1 text-2xl leading-none font-bold"
            ></p>
            <p
              class="source-contributor-name mb-0 text-base font-semibold tracking-wider text-base-content/70 uppercase"
            >
              <span class="text-base-content/50" aria-hidden="true">2.</span>
              <span class="source-contributor-name-text"></span>
            </p>
          </li>
          <li>
            <p
              class="source-contributor-total mb-1 text-2xl leading-none font-bold"
            ></p>
            <p
              class="source-contributor-name mb-0 text-base font-semibold tracking-wider text-base-content/70 uppercase"
            >
              <span class="text-base-content/50" aria-hidden="true">3.</span>
              <span class="source-contributor-name-text"></span>
            </p>
          </li>
        </ol>
      </div>
    </div>

    <div
      id="sources"
      class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      aria-label="Largest research funding sources"
    ></div>
  </div>
</div>
